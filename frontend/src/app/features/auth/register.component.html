<div class="auth-page">
  <div class="auth-card">
    @if (business.logo()) {
      <img class="auth-logo" [src]="business.logo()" alt="" />
    } @else {
      <span class="auth-logo-placeholder"><span appIcon="scissors" [iconSize]="36"></span></span>
    }

    @if (done(); as message) {
      <h1 class="text-2xl font-bold">Proveri mejl</h1>
      <p class="muted" data-testid="register-done">{{ message }}</p>
      <a routerLink="/login" class="auth-link">Nazad na prijavu</a>
    } @else {
      <h1 class="text-2xl font-bold">Napravi nalog</h1>
      <p class="muted mb-6">Za brže zakazivanje i pregled termina</p>

      <app-error-message [message]="error()" />

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="grid grid-cols-2 gap-3">
          <div class="field">
            <label for="r-first">Ime</label>
            <input id="r-first" appInput size="m" formControlName="first_name" autocomplete="given-name" data-testid="register-first-name" />
          </div>
          <div class="field">
            <label for="r-last">Prezime</label>
            <input id="r-last" appInput size="m" formControlName="last_name" autocomplete="family-name" data-testid="register-last-name" />
          </div>
        </div>
        <div class="field">
          <label for="r-email">Email</label>
          <input id="r-email" appInput size="m" type="email" formControlName="email" autocomplete="email" data-testid="register-email" />
        </div>
        <div class="field">
          <label for="r-phone">Telefon</label>
          <input id="r-phone" appInput size="m" type="tel" formControlName="phone" autocomplete="tel" data-testid="register-phone" />
        </div>
        <div class="field">
          <label for="r-channel">Obaveštenja preko</label>
          <select id="r-channel" appInput size="m" formControlName="preferred_communication">
            @for (option of communication; track option.value) {
              <option [ngValue]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="r-password">Lozinka (bar 8 karaktera)</label>
          <input id="r-password" appInput size="m" type="password" formControlName="password" autocomplete="new-password" data-testid="register-password" />
        </div>
        <app-button type="submit" size="l" [block]="true" [loading]="loading()" data-testid="register-submit">Registruj se</app-button>
      </form>

      <a routerLink="/login" class="auth-link">Već imaš nalog? Prijavi se</a>
      <a routerLink="/" class="auth-link !mt-1">Nazad na početnu</a>
    }
  </div>
</div>
