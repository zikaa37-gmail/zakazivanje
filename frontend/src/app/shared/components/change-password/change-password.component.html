<div class="card">
  <button type="button" class="flex items-center gap-2 w-full font-semibold text-left" (click)="open.set(!open())" data-testid="change-password-toggle">
    <span appIcon="lock" aria-hidden="true"></span>
    <span class="flex-1">Promeni lozinku</span>
    <span appIcon="chevron-down" aria-hidden="true"></span>
  </button>
  @if (open()) {
    <form [formGroup]="form" (ngSubmit)="save()" class="mt-3" novalidate>
      <app-error-message [message]="error()" />
      <div class="field">
        <label for="p-current">Trenutna lozinka</label>
        <input id="p-current" appInput size="m" type="password" autocomplete="current-password" formControlName="current_password" data-testid="current-password" />
      </div>
      <div class="field">
        <label for="p-new">Nova lozinka (bar 8 karaktera)</label>
        <input id="p-new" appInput size="m" type="password" autocomplete="new-password" formControlName="password" data-testid="new-password" />
      </div>
      <div class="field">
        <label for="p-new2">Ponovi novu lozinku</label>
        <input id="p-new2" appInput size="m" type="password" autocomplete="new-password" formControlName="password_confirmation" data-testid="new-password-confirmation" />
      </div>
      <div class="flex justify-end">
        <app-button type="submit" size="s" [loading]="saving()" data-testid="change-password-save">Promeni lozinku</app-button>
      </div>
    </form>
  }
</div>
