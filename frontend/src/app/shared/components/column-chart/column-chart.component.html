<div class="chart" [attr.data-testid]="testId() || null">
  <svg
    [attr.width]="width()"
    [attr.height]="height()"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    role="img"
    [attr.aria-label]="ariaLabel()"
    tabindex="0"
    (keydown)="onKeydown($event)"
    (focus)="onFocus()"
    (blur)="active.set(null)"
    (pointerleave)="active.set(null)"
  >
    @for (tick of ticks(); track tick.value) {
      <line class="grid" [attr.x1]="margin.left" [attr.x2]="width() - margin.right" [attr.y1]="tick.y" [attr.y2]="tick.y" />
      <text class="tick" [attr.x]="margin.left - 8" [attr.y]="tick.y + 4" text-anchor="end">{{ tick.label }}</text>
    }

    @for (bar of bars(); track bar.point.key) {
      @if (bar.path) {
        <path class="bar" [class.is-active]="active() === bar.index" [attr.d]="bar.path" />
      }
      @if (bar.isMax) {
        <text class="value-label" [attr.x]="bar.center" [attr.y]="bar.top - 6" text-anchor="middle">{{ format()(bar.point.value) }}</text>
      }
      @if (bar.showLabel) {
        <text class="tick" [attr.x]="bar.center" [attr.y]="height() - 8" text-anchor="middle">{{ bar.point.label }}</text>
      }
      <rect
        class="hit"
        [attr.x]="bar.bandX"
        [attr.y]="margin.top - 12"
        [attr.width]="bar.band"
        [attr.height]="height() - margin.top - margin.bottom + 12"
        (pointerenter)="active.set(bar.index)"
        (pointerdown)="active.set(bar.index)"
      />
    }
  </svg>

  @if (activeBar(); as bar) {
    <div class="tooltip" [style.left.px]="tooltipLeft()" [style.top.px]="bar.top" role="status" data-testid="chart-tooltip">
      <strong>{{ format()(bar.point.value) }}</strong>
      <span>{{ bar.point.tooltipLabel }}</span>
    </div>
  }

  <button type="button" class="table-toggle" (click)="showTable.set(!showTable())" [attr.aria-expanded]="showTable()">
    {{ showTable() ? 'Sakrij tabelu' : 'Prikaži tabelu' }}
  </button>
  @if (showTable()) {
    <div class="data-table-wrap mt-2">
      <table class="data-table">
        <tbody>
          @for (p of points(); track p.key) {
            <tr>
              <td>{{ p.tooltipLabel }}</td>
              <td class="text-right tabular-nums">{{ format()(p.value) }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
