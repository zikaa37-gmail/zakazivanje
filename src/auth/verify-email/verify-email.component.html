<div class="verify-email-container">
  <mat-card class="verify-email-card">
    <mat-card-header>
      <mat-card-title>Verifikacija Email-a</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (isVerifying()) {
        <div class="verifying-content">
          <mat-spinner diameter="60"></mat-spinner>
          <p>Verifikacija u toku...</p>
        </div>
      }

      @if (!isVerifying() && successMessage()) {
        <div class="success-content">
          <div class="success-icon">✓</div>
          <div class="success-message">
            {{ successMessage() }}
          </div>
        </div>
      }

      @if (!isVerifying() && errorMessage()) {
        <div class="error-content">
          <div class="error-icon">✕</div>
          <div class="error-message">
            {{ errorMessage() }}
          </div>
          <button mat-raised-button color="primary" (click)="goToLogin()" class="action-button">
            Nazad na prijavu
          </button>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
